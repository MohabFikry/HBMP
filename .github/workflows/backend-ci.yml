name: backend-ci

# .NET microservice build + test gate (16.8, finding H7). Builds the whole solution with warnings-as-errors
# (the repo enforces this — a warning fails the build), then runs the FULL suite against a real Postgres so
# the env-gated integration + RLS isolation tests actually execute instead of skipping. A domain-coverage
# floor guards against regression. Runs on backend-affecting changes.
#
# 24.1 — A GATE'S INPUTS ARE PART OF ITS TRIGGER. The paths filter below decides whether this workflow runs
# at all, so anything it omits is a file no gate here can ever see. That is not a slow gate or a weak gate;
# it is a gate that does not exist for those files, while the commit still shows a clean tick because no
# check was ever required. It bit us for real: docs/api holds the committed OpenAPI contracts and the drift
# gate exists to compare them against the running services, but "docs/**" was not listed — so the one commit
# whose entire content was a contract change (9f817a1, restoring 14 endpoints that had gone missing from the
# spec) triggered no run whatsoever. The gate guarding the contract was blind to commits that change the
# contract, which is the only kind of commit it exists to inspect.
#
# So every path a gate READS belongs here, not merely the code the build compiles:
#   docs/api/**        -> the OpenAPI drift gate's subject
#   docs/adr/**        -> check-coverage-exclusions.py and check-floor-monotonicity.py require a naming ADR
#   docs/quality/**    -> check-invariant-registry.py reads invariant-registry.yaml
#   docs/compliance/** -> check-integration-dpia.py reads the integration register
# The list is not maintained by hand: CiGateTests.The_workflow_triggers_on_every_file_a_gate_reads reads the
# scripts this workflow invokes, collects the docs/ trees they mention, and fails if one is missing here — so
# a gate added tomorrow that reads a new docs tree cannot quietly fail to trigger on it.
on:
  push:
    paths:
      - "services/**"
      - "libs/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - "HbmpPlatform.sln"
      - "tools/ci/**"
      - "docs/api/**"
      - "docs/adr/**"
      - "docs/quality/**"
      - "docs/compliance/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "libs/**"
      - "Directory.Packages.props"
      - "HbmpPlatform.sln"
      - "tools/ci/**"
      - "docs/api/**"
      - "docs/adr/**"
      - "docs/quality/**"
      - "docs/compliance/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for this job only. These credentials are throwaway CI values — NOT the real dev
    # secrets (those live in the gitignored infra/compose/.env; prod uses OpenBao).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hbmp
          POSTGRES_PASSWORD: ci_hbmp_pw
          POSTGRES_DB: hbmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hbmp -d hbmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # libpq connection used by the migration bootstrap (schema owner / superuser).
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: hbmp
      PGPASSWORD: ci_hbmp_pw
      PGDATABASE: hbmp
      # Passwords the bootstrap + env-exporter set on / use for the two DB roles.
      OWNER_PASSWORD: ci_hbmp_pw
      APP_PASSWORD: ci_hbmp_app_pw
      HBMP_APP_PASSWORD: ci_hbmp_app_pw
      # Coverage floors are NOT set here. They live in tools/ci/coverage-floors.json, the single
      # source of truth, guarded by check-floor-monotonicity.py (Gate 1.3 / Gate 7.3). A second copy
      # in this file is how a bar gets moved in a diff nobody reads as a bar being moved.


    steps:
      - uses: actions/checkout@v4
        with:
          # check-coverage-exclusions.py and check-floor-monotonicity.py diff against the previous commit.
          # At depth 1 there is no previous commit and both guards would silently have nothing to compare.
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # ============================================================================================
      # 24.1 — FAIL AT END. Every gate below runs even when an earlier one failed, and the job fails
      # at the very end if any of them did.
      #
      # WHY. Around 27 July this pipeline began dying at the migration-compat gate. Everything after it
      # — route coverage, scope drift, migrations, the tenant-isolation fuzzer, the whole test suite,
      # the coverage floor — never executed. For a month the build was red for ONE reason while six
      # other controls reported nothing, and a coverage number that looked like a 19-point collapse
      # went unseen because nothing ever asked for it. A skipped gate and a passing gate are both
      # silent, which is what made a month of it invisible.
      #
      # `continue-on-error` records the failure without stopping the job; the summary step at the
      # bottom reads every outcome and fails the build. A red build must still tell you the coverage
      # number, the route-coverage result and the scope-drift result.
      #
      # STATIC GATES RUN BEFORE THE BUILD, deliberately: they read source, not binaries, so a broken
      # build must not blind them either.
      # ============================================================================================

      - name: "gate: expand/contract migration-compat (12.2)"
        id: gate_migration_compat
        if: always()
        continue-on-error: true
        run: |
          python3 tools/ci/check-migration-compat.py --selftest
          python3 tools/ci/check-migration-compat.py --all

      # 18.E1 (audit R2 Q1) — this guard EXISTED and was never wired into CI, and it only inspected
      # /api/v1 — so it was blind to exactly the gap that shipped as W3 (the whole FHIR facade with no
      # route). Now it runs, and it covers every public prefix.
      - name: "gate: Kong route coverage (every served public prefix has a route)"
        id: gate_kong
        if: always()
        continue-on-error: true
        run: python3 tools/ci/check-kong-route-coverage.py

      # Phase 19: the SPA's scope literal is a hand-copy of IdentityContract.InteractiveScopes and had
      # drifted nineteen scopes behind it. Because the SPA asks for the union in one request, that is not
      # a degraded screen — it is a refused login (ID2051) or a token that 403s everywhere.
      - name: "gate: SPA scopes match the issuer's interactive set"
        id: gate_spa_scopes
        if: always()
        continue-on-error: true
        run: python3 tools/ci/check-spa-scopes.py

      - name: "gate: integration DPIA / data-sharing (13.3)"
        id: gate_dpia
        if: always()
        continue-on-error: true
        run: |
          python3 tools/ci/check-integration-dpia.py --selftest
          python3 tools/ci/check-integration-dpia.py

      # 24.0 — the denominator has the floor's power and none of its scrutiny, so it gets the same guard.
      - name: "gate: coverage-exclusions integrity (denominator)"
        id: gate_coverage_exclusions
        if: always()
        continue-on-error: true
        run: |
          python3 tools/ci/check-coverage-exclusions.py --selftest
          python3 tools/ci/check-coverage-exclusions.py --base "${{ github.event.before || 'HEAD~1' }}"

      # 24.2 — every invariant the design docs claim names a test, and that test must exist and run.
      # Coverage is a proxy; this is the thing the proxy stands for. Deleting or [Skip]-ing an invariant
      # test now fails the build with the invariant's own sentence in the error.
      #
      # --allow-unproven while Gate 3 fills the three known gaps (outbox-survives-crash,
      # dedupe-survives-restart, eligibility-matrix). Drop the flag when they are covered; leaving it on
      # permanently would turn "unproven" into a category nobody ever clears.
      - name: "gate: invariant registry"
        id: gate_invariant_registry
        if: always()
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml || true
          python3 tools/ci/check-invariant-registry.py --selftest
          python3 tools/ci/check-invariant-registry.py --allow-unproven

      # 24.1.3 — floors ratchet up. A decrease needs an ADR that exists and names the module.
      - name: "gate: coverage-floor monotonicity"
        id: gate_floor_monotonicity
        if: always()
        continue-on-error: true
        run: |
          python3 tools/ci/check-floor-monotonicity.py --selftest
          python3 tools/ci/check-floor-monotonicity.py --base "${{ github.event.before || 'HEAD~1' }}"

      # ---- build + the DB chain --------------------------------------------------------------------

      # ADVISORY: a failed restore cannot pass unnoticed — the very next step is the build gate, which is
      # counted and cannot succeed without it.
      - name: Restore
        if: always()
        continue-on-error: true
        run: dotnet restore HbmpPlatform.sln

      - name: "gate: build (Release, warnings-as-errors)"
        id: gate_build
        if: always()
        continue-on-error: true
        run: dotnet build HbmpPlatform.sln -c Release --no-restore

      - name: "gate: apply migrations + provision hbmp_app role"
        id: gate_apply_migrations
        if: always()
        continue-on-error: true
        run: bash tools/ci/apply-migrations.sh

      # 18.F3 — the control that would have caught X6 and S2 automatically. Every other check asks a
      # question someone thought to ask; this one asks the DATABASE what tables exist and proves isolation
      # on each, so a table added in a service nobody is thinking about is covered the day it lands.
      - name: "gate: tenant-isolation fuzzer (driven off information_schema)"
        id: gate_tenant_isolation
        if: always()
        continue-on-error: true
        run: |
          python3 tools/ci/check-tenant-isolation.py --selftest
          python3 tools/ci/check-tenant-isolation.py

      # 24.1 — the quietest gate in the file. Every DB-gated test answers Skip.If(<SERVICE>_TEST_DB is null),
      # so if this step fails the ~100 concurrency, RLS-isolation and break-glass proofs SKIP and the suite
      # still reports green — CLAUDE.md's "a green suite is only meaningful with this flag", inverted. It was
      # continue-on-error with no id, so that failure was recorded nowhere and counted for nothing. Now it is
      # a gate, and it checks its own effect rather than trusting the exit code.
      - name: "gate: wire *_TEST_DB env so integration + RLS suites run"
        id: gate_test_db_env
        if: always()
        continue-on-error: true
        run: |
          bash tools/ci/print-test-db-env.sh >> "$GITHUB_ENV"
          n=$(grep -c '_TEST_DB=' "$GITHUB_ENV" || true)
          echo "exported $n *_TEST_DB variable(s)"
          if [ "$n" -lt 20 ]; then
            echo "::error::only $n *_TEST_DB variables exported — the DB-gated suites would skip and the run"
            echo "would report green having proven none of the concurrency, RLS or break-glass invariants."
            exit 1
          fi

      - name: "gate: test (Release) with coverage"
        id: gate_tests
        if: always()
        continue-on-error: true
        run: >-
          dotnet test HbmpPlatform.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=test.trx"

      # Publishes the per-module table to the job summary on EVERY run, pass or fail (Gate 0.3).
      - name: "gate: domain-coverage floor"
        id: gate_coverage
        if: always()
        continue-on-error: true
        run: |
          python3 tools/ci/coverage-report.py --selftest
          bash tools/ci/coverage-gate.sh ./coverage

      # 24.1.4 — after a green run, propose tightening any floor measured coverage has left behind.
      # Advisory here (it prints); the scheduled workflow opens the PR.
      # ADVISORY: proposes a floor RAISE and prints it; the scheduled gate-health workflow opens the PR.
      # Its failure cannot weaken anything — the floors it would tighten stay where they are.
      - name: Ratchet check (proposes floor raises)
        if: always()
        continue-on-error: true
        run: python3 tools/ci/raise-floors.py --report ./coverage/coverage-report.json || true

      # ADVISORY: a failure here surfaces as the OpenAPI generate gate failing, which IS counted.
      - name: Restore local tools (Swagger CLI)
        if: always()
        continue-on-error: true
        run: dotnet tool restore

      # 24.1 — this step had no `id`, so with `continue-on-error: true` its failure was recorded nowhere and
      # counted for nothing: generation could fail for all 21 services and the job stayed green. Worse, the
      # drift gate that follows then had nothing to compare and reported the contract verified. It is a gate
      # now, and it is in the summary.
      - name: "gate: generate + validate OpenAPI specs (all services)"
        id: gate_openapi_generate
        if: always()
        continue-on-error: true
        run: |
          CI_DB="Host=localhost;Port=5432;Database=hbmp;Username=hbmp;Password=ci_hbmp_pw"
          # 18.E1 (Q2): Identity and Interop were MISSING from this list. identity-service is the newest
          # and most security-critical service on the platform — it mints every token — and it had no
          # OpenAPI regression gate at all.
          for k in Admin Approvals Audit CallCentre Case Claims Document Eligibility Emr Finance \
                   Identity Interop MasterData Notification Orders Patient Pharmacy Policy Provider Reporting; do
            export "ConnectionStrings__${k}=${CI_DB}"
          done
          bash tools/ci/generate-openapi.sh artifacts/openapi

      # 18.E1 (Q2) — OpenAPI DRIFT is a red build. CLAUDE.md says the spec is the source of truth; it was
      # generated in CI, uploaded as an artefact nobody opens, and thrown away, so the committed contract
      # and the running services could diverge indefinitely with nothing saying so.
      - name: "gate: OpenAPI drift (committed specs match the running services)"
        id: gate_openapi_drift
        if: always()
        continue-on-error: true
        run: |
          mkdir -p docs/api
          # 24.1 — REFUSE TO COMPARE NOTHING. This used to be `cp ... 2>/dev/null || true`, which turned a
          # generation that produced zero specs into a clean `git diff` and a PASS: the louder the upstream
          # failure, the greener this gate got. Nothing verified reads identically to nothing changed.
          n=$(ls artifacts/openapi/*.json 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::no generated specs to compare — the generation step produced none, so this gate"
            echo "cannot say anything about the committed contract. Failing rather than reporting it clean."
            exit 1
          fi
          echo "comparing $n generated spec(s) against docs/api"
          cp artifacts/openapi/*.json docs/api/
          if ! git diff --exit-code -- docs/api; then
            echo "::error::OpenAPI specs in docs/api are stale."
            echo "Run tools/ci/generate-openapi.sh locally and commit the result — the spec is the contract."
            exit 1
          fi

      # ADVISORY: artefact upload. Losing the upload loses convenience, not a verdict — every number it
      # carries was already asserted by a counted gate above.
      - name: Upload coverage + OpenAPI specs + test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-openapi
          path: |
            ./coverage
            ./artifacts/openapi
          retention-days: 14

      # ============================================================================================
      - name: Gate summary (fail-at-end)
        if: always()
        env:
          OUTCOMES: |
            migration-compat=${{ steps.gate_migration_compat.outcome }}
            kong-route-coverage=${{ steps.gate_kong.outcome }}
            spa-scopes=${{ steps.gate_spa_scopes.outcome }}
            integration-dpia=${{ steps.gate_dpia.outcome }}
            coverage-exclusions=${{ steps.gate_coverage_exclusions.outcome }}
            floor-monotonicity=${{ steps.gate_floor_monotonicity.outcome }}
            invariant-registry=${{ steps.gate_invariant_registry.outcome }}
            build=${{ steps.gate_build.outcome }}
            apply-migrations=${{ steps.gate_apply_migrations.outcome }}
            tenant-isolation=${{ steps.gate_tenant_isolation.outcome }}
            test-db-env=${{ steps.gate_test_db_env.outcome }}
            tests=${{ steps.gate_tests.outcome }}
            coverage=${{ steps.gate_coverage.outcome }}
            openapi-generate=${{ steps.gate_openapi_generate.outcome }}
            openapi-drift=${{ steps.gate_openapi_drift.outcome }}
        run: |
          echo "## Gate results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          while IFS='=' read -r gate outcome; do
            [ -z "$gate" ] && continue
            case "$outcome" in
              success) icon="PASS" ;;
              skipped) icon="DID NOT RUN"; failed=1 ;;
              *)       icon="FAIL"; failed=1 ;;
            esac
            printf '| %s | %s |\n' "$gate" "$icon" >> "$GITHUB_STEP_SUMMARY"
            printf '%-24s %s\n' "$gate" "$icon"
            # Heartbeat: record every gate that actually EXECUTED, so check-gate-freshness.py can tell
            # "passing" from "never ran". Failure still counts as execution — running is what is measured.
            if [ "$outcome" != "skipped" ]; then
              python3 tools/ci/check-gate-freshness.py --record "$gate" --state-dir .ci-state >/dev/null || true
            fi
          done <<< "$OUTCOMES"
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more gates failed or did not run — see the table above"
            exit 1
          fi
          echo "all gates passed"
      # The heartbeats the gate-health watchdog reads to tell "passing" from "never ran". Written by the
      # summary step below, so this upload must come after it — see the ordering note there.
      # ADVISORY: fail-safe by construction. A missed heartbeat makes check-gate-freshness.py alarm on the
      # next run, so losing this step raises the alarm rather than silencing it.
      - name: Upload gate heartbeats
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gate-heartbeats
          path: .ci-state
          retention-days: 30

      # ============================================================================================
      # The whole point of the restructure: one place that reads every gate's outcome, prints the
      # scoreboard, and decides the build. A gate that did not EXECUTE is as bad as one that failed —
      # that is the lesson of July — so 'skipped' counts against the build too.
