name: backend-ci

# .NET microservice build + test gate (16.8, finding H7). Builds the whole solution with warnings-as-errors
# (the repo enforces this — a warning fails the build), then runs the FULL suite against a real Postgres so
# the env-gated integration + RLS isolation tests actually execute instead of skipping. A domain-coverage
# floor guards against regression. Runs on backend-affecting changes.
on:
  push:
    paths:
      - "services/**"
      - "libs/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - "HbmpPlatform.sln"
      - "tools/ci/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "libs/**"
      - "Directory.Packages.props"
      - "HbmpPlatform.sln"
      - "tools/ci/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for this job only. These credentials are throwaway CI values — NOT the real dev
    # secrets (those live in the gitignored infra/compose/.env; prod uses OpenBao).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hbmp
          POSTGRES_PASSWORD: ci_hbmp_pw
          POSTGRES_DB: hbmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hbmp -d hbmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # libpq connection used by the migration bootstrap (schema owner / superuser).
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: hbmp
      PGPASSWORD: ci_hbmp_pw
      PGDATABASE: hbmp
      # Passwords the bootstrap + env-exporter set on / use for the two DB roles.
      OWNER_PASSWORD: ci_hbmp_pw
      APP_PASSWORD: ci_hbmp_app_pw
      HBMP_APP_PASSWORD: ci_hbmp_app_pw
      # 18.E1 (audit R2 Q4) — the RATCHET. 55 was set as a regression guard below the then-current value
      # and never moved, so it stopped meaning anything: coverage could fall a long way and still pass.
      # CLAUDE.md's target is 80. Raise this by +3 on each merge to main that improves it; the floor must
      # never go DOWN without an ADR saying why. Target: 80 by 2026-10-31.
      COVERAGE_MIN_DOMAIN: "58"
      # Overall coverage was printed and not gated at all. Now floored too — Api/Infrastructure lines are
      # exercised by the DB-gated suites, so a drop here means those stopped running, which is exactly the
      # failure a green build should not hide.
      COVERAGE_MIN_OVERALL: "45"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Restore
        run: dotnet restore HbmpPlatform.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build HbmpPlatform.sln -c Release --no-restore

      - name: Expand/contract migration-compat gate (12.2)
        run: |
          python3 tools/ci/check-migration-compat.py --selftest
          python3 tools/ci/check-migration-compat.py --all

      # 18.E1 (audit R2 Q1) — this guard EXISTED and was never wired into CI, and it only inspected
      # /api/v1 — so it was blind to exactly the gap that shipped as W3 (the whole FHIR facade with no
      # route). Now it runs, and it covers every public prefix.
      - name: Kong route-coverage gate (every served public prefix has a route)
        run: python3 tools/ci/check-kong-route-coverage.py

      # Phase 19: the SPA's scope literal is a hand-copy of IdentityContract.InteractiveScopes and had
      # drifted nineteen scopes behind it. Because the SPA asks for the union in one request, that is not a
      # degraded screen — it is a refused login (ID2051) or a token that 403s everywhere.
      - name: SPA scope gate (requested scopes match the issuer's interactive set)
        run: python3 tools/ci/check-spa-scopes.py

      - name: Integration DPIA / data-sharing gate (13.3)
        run: |
          python3 tools/ci/check-integration-dpia.py --selftest
          python3 tools/ci/check-integration-dpia.py

      - name: Apply migrations + provision hbmp_app role
        run: bash tools/ci/apply-migrations.sh

      # 18.F3 — the control that would have caught X6 and S2 automatically. Every other check asks a
      # question someone thought to ask; this one asks the DATABASE what tables exist and proves isolation
      # on each, so a table added in a service nobody is thinking about is covered the day it lands.
      # --selftest first: a checker that cannot fail is not a check.
      - name: Tenant-isolation fuzzer (every tenant_id table, driven off information_schema)
        run: |
          python3 tools/ci/check-tenant-isolation.py --selftest
          python3 tools/ci/check-tenant-isolation.py

      - name: Wire *_TEST_DB env so integration + RLS suites run
        run: bash tools/ci/print-test-db-env.sh >> "$GITHUB_ENV"

      - name: Test (Release) with coverage
        run: >-
          dotnet test HbmpPlatform.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=test.trx"

      # 24.0 — the denominator has the same power as the floor and none of the scrutiny, so it gets the
      # same guard: an added exclusion needs an ADR that exists and names the path, and Domain is never
      # excludable. --selftest first: a checker that cannot fail is not a check.
      - name: Coverage-exclusions guard (denominator integrity)
        run: |
          python3 tools/ci/check-coverage-exclusions.py --selftest
          python3 tools/ci/check-coverage-exclusions.py --base "${{ github.event.before || 'HEAD~1' }}"

      - name: Domain-coverage gate
        run: |
          python3 tools/ci/coverage-report.py --selftest
          bash tools/ci/coverage-gate.sh ./coverage

      - name: Restore local tools (Swagger CLI)
        run: dotnet tool restore

      - name: Generate + validate OpenAPI specs (all services)
        run: |
          CI_DB="Host=localhost;Port=5432;Database=hbmp;Username=hbmp;Password=ci_hbmp_pw"
          # 18.E1 (Q2): Identity and Interop were MISSING from this list. identity-service is the newest
          # and most security-critical service on the platform — it mints every token — and it had no
          # OpenAPI regression gate at all.
          for k in Admin Approvals Audit CallCentre Case Claims Document Eligibility Emr Finance \
                   Identity Interop MasterData Notification Orders Patient Pharmacy Policy Provider Reporting; do
            export "ConnectionStrings__${k}=${CI_DB}"
          done
          bash tools/ci/generate-openapi.sh artifacts/openapi

      # 18.E1 (Q2) — OpenAPI DRIFT is a red build.
      #
      # CLAUDE.md says the spec is the source of truth. It was generated in CI, uploaded as an artefact
      # nobody opens, and thrown away — so the committed contract and the running services could diverge
      # indefinitely and nothing said so. The specs now live in docs/api/ and a diff fails the build:
      # changing an endpoint means committing the regenerated spec, which puts the contract change in the
      # pull request where a reviewer sees it.
      - name: OpenAPI drift check (committed specs must match the running services)
        run: |
          mkdir -p docs/api
          cp artifacts/openapi/*.json docs/api/ 2>/dev/null || true
          if ! git diff --exit-code -- docs/api; then
            echo "::error::OpenAPI specs in docs/api are stale."
            echo "Run tools/ci/generate-openapi.sh locally and commit the result — the spec is the contract."
            exit 1
          fi

      - name: Upload coverage + OpenAPI specs + test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-openapi
          path: |
            ./coverage
            ./artifacts/openapi
          retention-days: 14
