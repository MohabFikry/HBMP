name: frontend-ci

# Design-system + portals CI. The axe accessibility gate fails the build on any serious/critical
# violation (0B §9 / 21-accessibility-checklist). Runs on frontend-affecting changes.
on:
  push:
    paths:
      - "apps/**"
      - "libs/contracts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "libs/contracts/**"

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint (fails on any error)
        run: pnpm lint:eslint

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @mersal/contracts lint
      - name: Contract invariant tests (US-060 / US-073)
        run: pnpm --filter @mersal/contracts test

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @mersal/design-system lint
      - name: Unit + accessibility (axe) tests
        run: pnpm --filter @mersal/design-system test
      - name: Build (Storybook/gallery bundle)
        run: pnpm --filter @mersal/design-system build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @mersal/web lint
      - name: Routing + permission-gating + accessibility (axe) tests
        run: pnpm --filter @mersal/web test
      - name: Build (portals bundle)
        run: pnpm --filter @mersal/web build

      # 2026-08-09 audit §2 — the deployed bundle must not CONTAIN the fixture backend. Builds both variants
      # and reads the emitted JavaScript; see the script's header for why "unreachable behind a LIVE branch"
      # was not good enough. Blocking: a demo sign-in compiled into a production bundle is not a warning.
      - name: Guard selftest (a checker that cannot fail is not a check)
        run: python3 tools/ci/check-live-bundle-clean.py --selftest
      - name: Live bundle carries no fixture backend
        id: gate_live_bundle
        run: python3 tools/ci/check-live-bundle-clean.py

      # The heartbeat the gate-health watchdog reads to tell "passing" from "never ran". Written to its OWN
      # file: backend-ci owns gate-heartbeats.json, and an artifact from this workflow that also contained
      # backend gates would carry a stale copy of them. check-gate-freshness.py merges every
      # gate-heartbeats*.json in the directory, newest wins.
      #
      # ADVISORY (`|| true`, always()) and fail-safe by construction: a missed heartbeat makes the watchdog
      # alarm tomorrow, so losing this step raises the alarm rather than silencing it.
      - name: Record gate heartbeat
        if: always()
        run: |
          [ "${{ steps.gate_live_bundle.outcome }}" = "skipped" ] && exit 0
          python3 tools/ci/check-gate-freshness.py --record live-bundle \
            --state-dir .ci-state --state-file gate-heartbeats.frontend.json >/dev/null || true
      - name: Upload gate heartbeats
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gate-heartbeats-frontend
          path: .ci-state
          retention-days: 30

  # 18.D3 (audit R2 U6) — colour contrast, in a browser.
  #
  # A separate job because it needs a Chromium binary and a BUILT bundle. It is not duplication of the axe
  # job above: jsdom has no layout or paint, so `color-contrast` is disabled there and reports nothing
  # whatever the palette does. Until now that meant contrast — the most common WCAG failure, and the reason
  # the token layer exists — was unverified everywhere while the a11y gate showed green.
  a11y-contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @mersal/web exec playwright install --with-deps chromium
      - name: Build (the bundle under test — real compiled CSS, not dev-server styles)
        run: pnpm --filter @mersal/web build
      - name: axe color-contrast (light + dark, en + ar)
        run: pnpm --filter @mersal/web test:a11y-contrast
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-a11y-trace
          path: apps/web/test-results/
          retention-days: 7
