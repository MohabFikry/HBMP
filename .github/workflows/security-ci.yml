name: security-ci

# Security gates (Phase 11.2). BLOCK release on any Critical/High vuln or exposed secret
# (NFR-034/035/037). SAST + SCA + container-image scan (Trivy), secret-scan (gitleaks),
# and DAST (OWASP ZAP baseline) against staging. Runs on push/PR + nightly.
on:
  push:
    branches: ["master", "main"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (secret hygiene — 100% secrets outside code, NFR-034)
        id: gate_secret_scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for pull_request events since the action's v2 breaking change — without it the action
          # refuses before scanning anything and reports a failure that looks identical to a found secret.
          # So on PRs, the branch where a secret is most likely to be caught, this gate has never once
          # examined the code; it only ever passed on push-to-master.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Heartbeat, so check-gate-freshness.py can tell "passing" from "never ran" — the same reason
      # backend-ci and frontend-ci write one. Own file: the watchdog merges every gate-heartbeats*.json in
      # the directory, newest wins, and an artifact carrying another workflow's gates would carry them stale.
      # ADVISORY (`|| true`, always()): a missed heartbeat makes the watchdog alarm tomorrow, so losing this
      # step raises the alarm rather than silencing it.
      - name: Record gate heartbeat
        if: always()
        run: |
          [ "${{ steps.gate_secret_scan.outcome }}" = "skipped" ] && exit 0
          python3 tools/ci/check-gate-freshness.py --record secret-scan \
            --state-dir .ci-state --state-file gate-heartbeats.secret-scan.json >/dev/null || true
      - name: Upload gate heartbeats
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gate-heartbeats-secret-scan
          path: .ci-state
          retention-days: 30
          # `.ci-state` is a HIDDEN directory, and upload-artifact v4 skips hidden files unless told not
          # to. Without this line the artifact uploads EMPTY, which is how every heartbeat since the
          # watchdog was written went missing: gate-health then reported all 18 gates as "never executed",
          # and a real gate going quiet would have looked exactly the same.
          include-hidden-files: true

  sca-sast-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SCA + SAST (IaC/config/filesystem) — fail on Critical/High
      #
      # The tag is `v`-prefixed. It was written `@0.24.0`, which does not exist — every tag this action has
      # ever published is `v0.24.0`-shaped — so the job died in "Set up job", before a single step ran, on
      # every push since it was added. GitHub resolves actions during job setup, which is why the failure
      # never named Trivy and read as infrastructure flake. A gate that has never once executed is not a
      # gate, which is the case check-gate-freshness.py was written for; this one predates its coverage.
      - name: Trivy filesystem (SCA + config/SAST)
        id: gate_sca_sast
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1" # block release (NFR-035/037)
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-fs.sarif }

      # See the heartbeat note in secret-scan above. This job is the reason both are now in REQUIRED_GATES:
      # it never executed once, and nothing said so.
      - name: Record gate heartbeat
        if: always()
        run: |
          [ "${{ steps.gate_sca_sast.outcome }}" = "skipped" ] && exit 0
          python3 tools/ci/check-gate-freshness.py --record sca-sast-image \
            --state-dir .ci-state --state-file gate-heartbeats.sca.json >/dev/null || true
      - name: Upload gate heartbeats
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gate-heartbeats-sca
          path: .ci-state
          retention-days: 30
          # `.ci-state` is a HIDDEN directory, and upload-artifact v4 skips hidden files unless told not
          # to. Without this line the artifact uploads EMPTY, which is how every heartbeat since the
          # watchdog was written went missing: gate-health then reported all 18 gates as "never executed",
          # and a real gate going quiet would have looked exactly the same.
          include-hidden-files: true

  codeql-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: csharp }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build HbmpPlatform.sln -c Release
      - uses: github/codeql-action/analyze@v3

  dast-zap:
    # DAST against a running staging origin (manual/nightly — needs a reachable target).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP baseline scan (staging via Kong)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.STAGING_BASE_URL }}
          rules_file_name: .zap/rules.tsv
          fail_action: true
