# gitleaks config for Mersal HBMP (Phase 11.2 secret hygiene, NFR-034).
# Policy: zero secrets in code/config/images. All runtime secrets are injected via env
# (${VAR} interpolation from a gitignored .env locally; OpenBao/Vault + SOPS in prod).
title = "mersal-hbmp-gitleaks"

[extend]
useDefault = true # inherit the default rule pack (AWS keys, private keys, tokens, etc.)

# Custom rule (16.1, C2): catch Mersal-style prose/dev password literals baked into code, config, docs or
# scripts (the "Dev_<name>Pass_<year>!" shape used for DB / Keycloak / app-role dev secrets). Runtime
# secrets are injected via env/OpenBao — the literal value must never appear in a tracked file. Default
# rules miss these (prose). The regex below is the single source of truth for the pattern.
[[rules]]
id = "mersal-prose-password"
description = "Mersal dev/prose password literal (Dev_*_20YY)"
regex = '''Dev_[A-Za-z0-9]+_20\d\d'''
tags = ["password", "mersal"]

# 18.B1 (audit R2 X4/X5): the R1 purge missed TWO shapes, and both then regressed — a credential sitting in
# a JSON config VALUE (the MinIO key for the PHI blob bucket, in services/document/Api/appsettings.json)
# and a `?? "literal"` C# fallback for a client secret (identity ClientSeeder) or a password (UserSeeder).
# Neither looks like a secret to the default rule pack; both are now a red build.
[[rules]]
id = "mersal-config-credential-value"
description = "Credential-shaped VALUE in a tracked appsettings file (secrets come from env/OpenBao only)"
regex = '''"(?i:secret_?key|access_?key|client_?secret|password|api_?key)"[ \t]*:[ \t]*"[^"$\n]{6,}"'''
path = '''appsettings.*\.json$'''
tags = ["password", "config", "mersal"]

# A credential embedded in a connection URI hides from key-based rules because the secret is not next to a
# recognisable field name. This is how the dev broker password stayed in audit + hello appsettings through
# the R1 purge. `guest:guest` is allow-listed below: it is RabbitMQ's own published default, overridden by
# compose, not a Mersal secret.
[[rules]]
id = "mersal-uri-embedded-credential"
description = "Credential embedded in a connection URI (amqp/redis/postgres/http) in a tracked file"
regex = '''(?i:amqp|amqps|redis|postgres|postgresql|mongodb|https?)://[A-Za-z0-9._%-]+:[^@\s"/]{4,}@'''
tags = ["password", "config", "mersal"]

# Throwaway credentials for CI's own ephemeral service containers. These protect a Postgres/RabbitMQ that
# lives for the minutes of one job, on a runner nobody else can reach, bound to localhost — they are not
# secrets and there is nothing to rotate. backend-ci.yml already says so in prose; this encodes the SAME
# convention for the scanner, so the rule stops firing on the one value that happens to be URI-shaped while
# staying silent about the identical values beside it that are not.
#
# Keyed to the `ci_<name>_pw` naming convention AND to localhost, rather than to the workflow path: a real
# credential pasted into a workflow matches neither and still fails the build. `regexTarget = "line"` because
# the rule's own match stops at the `@`, so the host is not in the captured secret.
[rules.allowlist]
description = "CI service-container throwaway credentials (ephemeral, localhost-only, nothing to rotate)"
regexTarget = "line"
regexes = ['''://[a-z0-9_-]+:ci_[a-z0-9_]+_pw@localhost''']

[[rules]]
id = "mersal-code-secret-fallback"
description = "C# ?? fallback to a literal secret/password — a missing secret must fail fast, never default"
regex = '''(?i:secret|password|apikey)[^\n;]{0,40}\?\?[ \t]*"[^"\n]{6,}"'''
path = '''\.cs$'''
tags = ["password", "mersal"]

[allowlist]
description = "Non-secret matches: env-var placeholders, build artifacts, and third-party reference data."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)bin/''',
  '''(^|/)obj/''',
  '''\.deps\.json$''',      # NuGet hash paths, not secrets
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  # Third-party clinical reference exports (ATC drug catalogue, CPT, ICD-10) — data, not code or config.
  # `generic-api-key` is an ENTROPY rule, and pharmaceutical names score like keys: the four current hits are
  # "CAPIXY HAIR MASK 250ML,CAPIXYL+GLYCERIN+ALOE VERA+SHEA BUTTER" and
  # "ANTI-DIABETIC.SECRETAGOGUES.DPP-4 INHIBITORS". No credential is ever authored here — these files are
  # regenerated wholesale from the source workbooks by tools/masterdata-loader. Scoped to the data
  # extensions so a stray .sh or .env dropped in this directory is still scanned.
  '''^Raw Files/.*\.(csv|xlsx)$''',
]
# ${VAR} interpolation in compose/config is a placeholder, not a secret — the value lives in
# the gitignored .env (local) / OpenBao (prod). Allow those specific shapes only.
regexes = [
  '''\$\{[A-Z0-9_]+\}''',              # ${POSTGRES_PASSWORD} etc.
  '''password=\$\{[A-Z0-9_]+\}''',
  '''secretKeyRef:''',                 # k8s secret references
  '''change-me[-a-z0-9]*''',           # documented placeholders in *.env.example, never live values
  '''//guest:guest@''',                # RabbitMQ's own published default; compose overrides it
]
# Known non-secret literals, matched against the captured value rather than the line.
stopwords = [
  "beneficiary360",                      # a portal nav section key in apps/web/src/portals/catalog.ts
  "a592d99a-ca90-4111-aeab-e2da16469fc1", # synthetic dev doctor id in infra/compose/seed (never real PHI)
]
