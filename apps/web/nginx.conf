# Static serving for the Mersal SPA. History-API routing → always fall back to index.html; long-cache the
# fingerprinted assets but never the HTML shell, so a redeploy is picked up immediately. Listens on 8080 to match
# the unprivileged-port convention the service images use.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else resolves to the SPA shell (client-side routing). Never cache the shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
