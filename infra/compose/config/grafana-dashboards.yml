# Grafana dashboard provisioning (Phase 11.3). Loads dashboards-as-code from the mounted dir.
apiVersion: 1
providers:
  - name: mersal-dashboards
    orgId: 1
    folder: Mersal
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
