_format_version: "3.0"
# Kong DB-less declarative config (Tier 1). Single public API origin at :8000 for the SPA.
# Kong routes /api/v1/<area> to the owning service and applies a dev CORS policy
# (SPA origin http://localhost:5173). Services ALSO fully validate the JWT (defense in depth,
# libs/auth) — Kong here does routing + CORS + correlation-id.
#
# Edge auth (Phase 17.6): the issuer is now in-house (identity-service — ASP.NET Identity + OpenIddict,
# ADR-0015) with a STABLE JWKS at http://identity-service:8080/.well-known/jwks. The OIDC/OAuth endpoints
# (/connect/*, /.well-known/*) are routed to it below so the SPA reaches one origin. JWKS-based signature
# validation is enforced at every service (defense in depth, libs/auth); for true EDGE enforcement in Tier
# 2/3 add Kong's openid-connect plugin pointed at that JWKS (community-edition `jwt` cannot do JWKS
# discovery with rotating RS256 keys). Phase 18.B3 (S8) closed this: the edge now enforces a signed,
# unexpired token globally via the OSS `jwt` plugin against the issuer's registered RS256 public key (see
# the consumers block below), and the services remain the enforcement point for scope/role/ABAC.
#
# Routing is by the service's REAL path prefix (see each service's MapGroup). Sub-paths under
# /api/v1/beneficiaries are owned by MULTIPLE services (patient, emr, eligibility, document); the
# regex routes below out-prioritise the patient catch-all so each lands on its true owner.

services:
  # --- masterdata-service: reference data (owns several bare /api/v1 resources) ---
  - name: masterdata-service
    url: http://masterdata-service:8080
    plugins: &edge_jwt
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: ["exp"]
          run_on_preflight: false   # a CORS preflight carries no Authorization header by design
    routes:
      - name: masterdata-routes
        paths:
          - /api/v1/icd-codes
          - /api/v1/cpt-codes
          - /api/v1/atc-classes
          - /api/v1/drugs
          - /api/v1/drug-interactions
          - /api/v1/allergens
          - /api/v1/allergies
          - /api/v1/examination-types
          - /api/v1/search
        strip_path: false

  # --- emr-service: encounters, appointments, clinical docs, queue ---
  # The /beneficiaries/{id}/allergies + /medication-history sub-resources belong to emr, NOT patient.
  - name: emr-service
    url: http://emr-service:8080
    plugins: *edge_jwt
    routes:
      - name: emr-beneficiary-clinical-routes
        paths:
          - "~/api/v1/beneficiaries/[^/]+/allergies$"
          - "~/api/v1/beneficiaries/[^/]+/allergies/.*"
          - "~/api/v1/beneficiaries/[^/]+/medication-history$"
          - "~/api/v1/beneficiaries/[^/]+/medication-history/.*"
          # 20.2 — the seam the patient profile's PMH + encounters sections read.
          - "~/api/v1/beneficiaries/[^/]+/profile-context$"
        regex_priority: 200
        strip_path: false
      - name: emr-routes
        paths:
          - /api/v1/encounters
          - /api/v1/appointments
          - /api/v1/appointment-slots
          # 14.5 — the two reads the booking journey makes. They shipped without routes, so the day picker
          # and the specialty/doctor filter were 404 at the gateway while working perfectly in fixture mode.
          # The route-coverage gate catches exactly this, and it was never reached because CI died earlier.
          - /api/v1/appointment-days
          - /api/v1/booking
          # The clinics a scheduler may book into, derived from slots in their branch (appointment:read).
          - /api/v1/branch-clinics
          # 25.4 — leave / public holiday / clinic closure / ad-hoc clinic, plus the impact preview the
          # apply is gated on. Without a route the roster screen 404s at the gateway while working in
          # fixture mode, which is exactly what happened to the two booking reads above.
          - /api/v1/roster-exceptions
          - /api/v1/queue
          - /api/v1/queues
          - /api/v1/treating-relationship
        strip_path: false

  # --- inventory-service: clinic stock (25.5/25.6) ---
  # Medical and non-medical consumables on an append-only movement ledger. NOT a dispensing path: no route
  # here accepts a beneficiary identifier, and NoPhiInInventoryTests fails the build if one appears.
  - name: inventory-service
    url: http://inventory-service:8080
    plugins: *edge_jwt
    routes:
      - name: inventory-routes
        paths:
          - /api/v1/inventory
        strip_path: false

  # --- eligibility-service: reception search + eligibility check + coverage-summary card ---
  - name: eligibility-service
    url: http://eligibility-service:8080
    plugins: *edge_jwt
    routes:
      - name: eligibility-beneficiary-coverage-route
        paths:
          - "~/api/v1/beneficiaries/[^/]+/coverage-summary$"
        regex_priority: 200
        strip_path: false
      - name: eligibility-routes
        paths: ["/api/v1/eligibility", "/api/v1/reception"]
        strip_path: false

  # --- document-service: beneficiary documents (upload/list under /beneficiaries/{id}/documents) ---
  - name: document-service
    url: http://document-service:8080
    plugins: *edge_jwt
    routes:
      - name: document-beneficiary-routes
        paths:
          - "~/api/v1/beneficiaries/[^/]+/documents$"
          - "~/api/v1/beneficiaries/[^/]+/documents/.*"
        regex_priority: 200
        strip_path: false
      # 19.5b — files that belong to an OPERATION rather than to a person: a bulk upload, its PHI-bearing
      # error report, a data extract. Same pipeline (validate → scan → MinIO), separate table, and the
      # download is an authorized, audited stream rather than a signed URL that outlives its authorization.
      - name: document-operational-routes
        paths: ["/api/v1/operational-documents"]
        strip_path: false

  # --- patient-service: beneficiary registration + identifiers (catch-all for /beneficiaries) ---
  - name: patient-service
    url: http://patient-service:8080
    plugins: *edge_jwt
    routes:
      - name: patient-routes
        paths: ["/api/v1/beneficiaries", "/api/v1/registrations"]
        strip_path: false

  # --- policy-service: the PAS — payers, plans, effective-dated benefit configuration, coverage + limits ---
  - name: policy-service
    url: http://policy-service:8080
    plugins: *edge_jwt
    routes:
      - name: policy-routes
        paths:
          - /api/v1/policies
          - /api/v1/coverages
          - /api/v1/coverage-limits
          # 19.1 — the benefit product layer.
          - /api/v1/payers
          - /api/v1/plans
          - /api/v1/plan-versions
          # 19.6 — reference data the plan-version editor needs to render its row set (codes + names, no PHI).
          - /api/v1/benefit-categories
          # 19.2 + 19.2b — the membership layer.
          - /api/v1/policy-plans
          - /api/v1/member-groups
          - /api/v1/enrollments
          # 19.3 — signed, append-only notes on policy + member.
          - /api/v1/notes
          # 19.3b — classified documents on policy + member (linkage; bytes stay in document-service).
          - /api/v1/documents
          # 19.3c — the change timeline (a projection over the audit stream).
          - /api/v1/timeline
          # 19.4 — utilization for member · group · plan · policy · payer (read-only; no clinical fields).
          - /api/v1/utilization
          # 19.5 — structured search + coverage detail. Payer-scoped server-side; page size capped.
          - /api/v1/policy-query
          - /api/v1/member-query
          # 19.5b — bulk upload in, data extract out. Both are scoped, audited and row-limited server-side;
          # the gateway only routes them.
          - /api/v1/bulk-jobs
          - /api/v1/bulk-templates
          - /api/v1/extracts
        strip_path: false
      # 19.5 — the administrative 360 lives under /beneficiaries, which patient-service owns as a
      # catch-all. Same shape as emr's allergies and document-service's documents: a regex route for the
      # ONE sub-resource, so the catch-all keeps everything else.
      - name: policy-administrative-360
        paths:
          - "~/api/v1/beneficiaries/[^/]+/administrative-360$"
        strip_path: false
      # 20.3 — resolve a member's identification photograph to a short-TTL signed URL. Same regex-route shape,
      # same reason. profile-service is its only caller today, on behalf of a receptionist or a clinician.
      - name: policy-identity-photo
        paths:
          - "~/api/v1/beneficiaries/[^/]+/identity-photo$"
        strip_path: false

  # --- provider-service: provider network + contracts + branches + practitioners + specialties ---
  - name: provider-service
    url: http://provider-service:8080
    plugins: *edge_jwt
    routes:
      - name: provider-routes
        paths:
          - /api/v1/providers
          - /api/v1/contracts
          - /api/v1/branches
          - /api/v1/practitioners
          - /api/v1/specialties
          # Label-only clinic lookup for schedulers (appointment:read). Names for ids the caller already
          # holds — never the provider directory, which stays behind provider:read.
          - /api/v1/clinic-labels
          # Branch names for the cross-branch boards (appointment:read, explicit ids only).
          - /api/v1/branch-labels
          # 19.1b — network tiers + effective-dated tier assignment + the service-date resolver.
          - /api/v1/network-tiers
        strip_path: false

  # --- orders-service: investigation orders + lab/imaging fulfillment + report-access ---
  - name: orders-service
    url: http://orders-service:8080
    plugins: *edge_jwt
    routes:
      - name: orders-routes
        paths:
          - /api/v1/investigation-orders
          - /api/v1/report-access-requests
          - /api/v1/report-access-grants
          - /api/v1/report-access
        strip_path: false

  # --- pharmacy-service: prescriptions + dispensing + referrals ---
  - name: pharmacy-service
    url: http://pharmacy-service:8080
    plugins: *edge_jwt
    routes:
      - name: pharmacy-routes
        paths: ["/api/v1/prescriptions", "/api/v1/referrals"]
        strip_path: false

  # --- approvals-service: authorization worklist + decisions ---
  - name: approvals-service
    url: http://approvals-service:8080
    plugins: *edge_jwt
    routes:
      - name: approvals-routes
        paths: ["/api/v1/authorizations"]
        strip_path: false

  # --- notification-service ---
  - name: notification-service
    url: http://notification-service:8080
    plugins: *edge_jwt
    routes:
      - name: notification-routes
        paths: ["/api/v1/notifications"]
        strip_path: false

  # --- reporting-service: KPIs + dashboards ---
  - name: reporting-service
    url: http://reporting-service:8080
    plugins: *edge_jwt
    routes:
      - name: reporting-routes
        paths: ["/api/v1/reports", "/api/v1/dashboards", "/api/v1/analytics"]
        strip_path: false

  # --- admin-service: platform administration + caller's own branch context (/me) ---
  - name: admin-service
    url: http://admin-service:8080
    plugins: *edge_jwt
    routes:
      - name: admin-routes
        paths: ["/api/v1/admin", "/api/v1/me"]
        strip_path: false

  # --- case-service: case management + beneficiary-360 (Phase 10.1) ---
  - name: case-service
    url: http://case-service:8080
    plugins: *edge_jwt
    routes:
      - name: case-routes
        paths: ["/api/v1/cases"]
        strip_path: false

  # --- finance-service: utilization/settlements/summaries/exports (Phase 10.2) ---
  - name: finance-service
    url: http://finance-service:8080
    plugins: *edge_jwt
    routes:
      - name: finance-routes
        paths: ["/api/v1/finance"]
        strip_path: false

  # --- claims-service: claims capture/batching/adjudication/settlement (Phase 10b) ---
  - name: claims-service
    url: http://claims-service:8080
    plugins: *edge_jwt
    routes:
      - name: claims-routes
        paths: ["/api/v1/claims", "/api/v1/claim-batches", "/api/v1/reconciliation", "/api/v1/reimbursement-requests"]
        strip_path: false

  # --- callcentre-service: contact centre — verification + call log + member 360 + call actions (Phase 15) ---
  - name: callcentre-service
    url: http://callcentre-service:8080
    plugins: *edge_jwt
    routes:
      - name: callcentre-routes
        paths: ["/api/v1/call-interactions", "/api/v1/call-centre"]
        strip_path: false
      # 20.3b — the member's call history, read BY BENEFICIARY by the patient profile's callHistory section
      # (+ the copy-all endpoint). Under /beneficiaries, which patient-service owns as a catch-all, so it needs
      # the same regex-route treatment as emr's allergies and policy's administrative-360.
      - name: callcentre-history-routes
        paths:
          - "~/api/v1/beneficiaries/[^/]+/call-interactions$"
          - "~/api/v1/beneficiaries/[^/]+/call-interactions/copy$"
        strip_path: false

  # --- profile-service: the unified patient profile (Phase 20, design 39). Composition only — it owns no data
  # and holds no database; every section is fetched from its owning service under the CALLER'S token. ---
  - name: profile-service
    url: http://profile-service:8080
    plugins: *edge_jwt
    routes:
      # /api/v1/patients is this service's own namespace: the profile, its role-projected print summary, and
      # the consent-gated identity photo (which 302s to a short-TTL signed URL — the bytes never pass through).
      - name: profile-routes
        paths: ["/api/v1/patients"]
        strip_path: false

  # --- interop-service: the FHIR R4 façade (13.1) + partner integration registry (13.2). ---
  # 18.C2 (audit R2 W3): phase 13 had no route at all. It serves /fhir rather than /api/v1, which is also why
  # the API coverage guard never flagged it — the guard only inspects /api/v1 paths.
  - name: interop-service
    url: http://interop-service:8080
    plugins: *edge_jwt
    routes:
      # The CapabilityStatement is public by FHIR convention: a client fetches it BEFORE it has a token, to
      # discover which interactions and SMART scopes this server supports and where to authenticate. Gating it
      # behind the edge jwt plugin would make the façade undiscoverable, so this one path is exempt — and only
      # this one. It advertises capabilities and contains no patient data.
      - name: interop-metadata-route
        paths: ["~/fhir/r4/metadata$"]
        regex_priority: 300
        strip_path: false
        plugins:
          - name: jwt
            enabled: false
      - name: interop-routes
        paths: ["/fhir", "/interop"]
        strip_path: false

  # --- identity-service: the in-app OIDC issuer (Phase 17). OAuth/OIDC endpoints + discovery/JWKS. ---
  - name: identity-service
    url: http://identity-service:8080
    routes:
      # 18.C2 (audit R2 W5): /identity was unroutable, so the in-app user/role/scope admin that closes C3
      # could not be reached from the SPA at all and the admin console went on editing the legacy
      # admin-service projection instead of the real identity store.
      - name: identity-admin-routes
        paths: ["/identity"]
        strip_path: false
        # The admin surface is a normal protected API and carries the edge check like any other route.
        plugins: *edge_jwt
      # 21.6 — the phase-21 user & access surfaces, listed explicitly rather than left to the /identity
      # prefix above. They are already reachable through it; naming them here is so the edge config states
      # WHAT is exposed, and so a future narrowing of the broad prefix cannot silently unroute them.
      #
      # They deliberately keep the existing admin:read / admin:write scopes rather than minting
      # admin:access:read/write and platform:admin. Those would extend the FROZEN scope vocabulary
      # (docs/security/token-contract.md §2) to split a permission that is already enforced correctly, and
      # platform administration is already modelled by the is_platform_admin flag plus the catalog's
      # is_platform_admin_key marker (A1) — a parallel scope would be a second mechanism for one rule, and
      # the two would drift. See ADR-0021.
      - name: identity-access-model-routes
        paths:
          - "/identity/admin/memberships"      # 21.2 per-membership overrides + effective-access preview
          - "/identity/admin/access-review"    # 21.5 access-review snapshot (JSON + CSV, audited export)
          - "/identity/me"                     # 21.5 self-service sessions + login history
        strip_path: false
        # Same reasoning as identity-admin-routes: protected admin/self-service APIs, edge check attached.
        plugins: *edge_jwt
      # 18.B3 (S8) — the ONE surface with NO edge jwt: these routes are how a caller OBTAINS a token
      # (/connect/authorize, /connect/token, the login + 2FA pages) and how a verifier fetches the signing
      # keys (/.well-known/jwks, the discovery document). Requiring a token to reach them is a bootstrap
      # deadlock, so the plugin is simply not attached here.
      #
      # It previously said `enabled: false` at route scope and claimed that "route scope beats global scope".
      # It does not: in Kong a route-scoped plugin instance marked `enabled: false` is an INACTIVE INSTANCE,
      # not an override, and a globally-scoped plugin keeps applying. Kong OSS has no way to switch a global
      # plugin off for one route. So the exemption never took effect and the gateway answered 401 to the
      # discovery document, JWKS and /connect/authorize alike — the SPA could not begin a login through Kong
      # at all. The fix is structural: jwt is no longer global (see the `plugins:` block at the end of this
      # file), it is attached per service via the `edge_jwt` anchor, and omitted here.
      - name: identity-oidc-routes
        paths: ["/connect", "/.well-known"]
        strip_path: false

# 18.B3 (audit R2 S8) — EDGE authentication. Until now Kong did routing, CORS and correlation ids only:
# an unauthenticated request was proxied all the way to a service and rejected there. Every service does
# validate the JWT (libs/auth, defense in depth), so this was not an open door — but it meant the gateway
# forwarded anonymous traffic to twenty internal services, and any service that ever shipped a route without
# .RequireAuthorization inherited a public endpoint. The edge now rejects an unsigned or expired token before
# it reaches the mesh, and the services keep validating independently.
#
# Kong OSS has no openid-connect plugin (Enterprise) and its `jwt` plugin cannot discover JWKS, so the
# issuer's RS256 PUBLIC key is registered here as a consumer credential, keyed on the `iss` claim. That is
# workable only because Phase 12.3 made the issuer keys PERSISTENT in OpenBao — with the old ephemeral
# per-restart keys this would have broken on every deploy. The key is public by definition; it is injected
# rather than committed so that a rotation is a config change, not a code change.
consumers:
  - username: hbmp-issuer
    jwt_secrets:
      # Rendered at container start from IDENTITY_ISSUER / IDENTITY_JWKS_PUBLIC_KEY (see the kong service's
      # entrypoint in compose.yaml). The public key is not a secret, but it is deployment-specific and must
      # track whatever OpenBao holds — a mismatch here rejects every token at the edge, so it is injected
      # rather than committed.
      #
      # This ORIGINALLY used Kong's `{vault://env/…}` references and could never have booted: only fields
      # declared `referenceable` in a plugin's schema are resolved, and `jwt_secrets.rsa_public_key` is not
      # one of them (Kong OSS marks only `secret`). Kong therefore kept the reference as a literal string and
      # rejected the whole declarative file with "in 'rsa_public_key': invalid key" — so the edge-JWT block
      # added in 18.B3 had never actually started. It went unnoticed because the running gateway predated it
      # and Kong reads this file only at boot.
      #
      # The PEM is substituted as a DOUBLE-QUOTED YAML scalar with \n escapes, which YAML expands back into
      # the real newlines a PEM needs — a plain sed cannot inject a multi-line value into one line.
      - key: "__IDENTITY_ISSUER__"
        algorithm: RS256
        rsa_public_key: "__IDENTITY_JWKS_PUBLIC_KEY__"

plugins:
  # NOTE: `jwt` is deliberately NOT here. A global plugin cannot be switched off for one route in Kong OSS,
  # and the OIDC bootstrap routes (/connect, /.well-known) must be reachable without a token. It is attached
  # per service instead, via the `edge_jwt` anchor defined on the first service above — so every service
  # carries the edge check and the one exemption is expressed by simply not attaching it.
  #
  # Dev CORS: allow the Vite SPA origin to call the API with a bearer token.
  # credentials:false — the SPA sends the token in the Authorization header, not cookies, so we do not
  # need (and must not advertise) credentialed CORS. If-Match/ETag support optimistic concurrency.
  - name: cors
    config:
      origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      # 18.C1 (audit R2 W2) — X-Active-Branch on BOTH lists. Missing from `headers`, the browser's preflight
      # rejects it and the request never leaves the page; missing from `exposed_headers`, the response echo is
      # invisible to JS, so the switcher cannot tell the user which branch the server actually honoured.
      # Branch scoping was built end to end in Phase 14 and sat inert for want of these two entries.
      headers: ["Authorization", "Content-Type", "Idempotency-Key", "Accept-Language", "X-Correlation-Id", "If-Match", "X-Active-Branch"]
      exposed_headers: ["X-Correlation-Id", "ETag", "X-Active-Branch"]
      credentials: false
      max_age: 3600
  # Global correlation IDs (W3C-style) on every request.
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      echo_downstream: true
  # Safety-net global rate limit.
  - name: rate-limiting
    config: { minute: 1200, policy: local }
