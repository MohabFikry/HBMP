      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Notification: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8101:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
    networks: [hbmp]

  # --- reporting-service (8.2/8.3): event-projected read-model + executive dashboard. ---
  reporting-service:
    build: { context: ../.., dockerfile: services/reporting/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Reporting: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8102:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
    networks: [hbmp]

  # --- admin-service (8b): user/role admin + SoD + governance + break-glass + tenants. ---
  admin-service:
    build: { context: ../.., dockerfile: services/admin/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Admin: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
