# Mersal HBMP — Tier 1 (single-server) Docker Compose starter
# Open-source, on-prem-first, cloud-ready stack (see ../../0C-OPEN-SOURCE-STACK.md).
# This stands up the INFRASTRUCTURE the platform runs on. Application services
# (identity/patient/policy/... + web) are added as they are built — a template is at the bottom.
#
# ⚠️ STARTER, NOT PRODUCTION-HARDENED. Before real data:
#   - move every secret out of .env into OpenBao; enable TLS at the edge (Traefik + Let's Encrypt + ModSecurity/OWASP CRS)
#   - turn OpenSearch security ON; run Keycloak in production mode; run OpenBao as a real server (not -dev)
#   - enable LUKS full-disk encryption on the host; wire pgBackRest + restic offsite backups
# See README.md and phase-11-hardening-and-nfr.md.

name: mersal-hbmp

x-restart: &restart
  restart: unless-stopped

networks:
  hbmp:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  rabbitmqdata:
  opensearchdata:
  grafanadata:
  prometheusdata:
  lokidata:
  baodata:

services:
  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports: ["55432:5432"]  # 55432 on host (local PG16 owns 5432); services use hostname "postgres"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hbmp]

  # ---------------------------------------------------------------- Keycloak (identity, MFA)
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    <<: *restart
    # --import-realm loads the mersal realm-as-code on first boot (clients, roles, scopes, MFA).
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # KC 25 uses KEYCLOAK_ADMIN/_PASSWORD; KC 26+ uses KC_BOOTSTRAP_ADMIN_*. Set both for portability.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      # Realm-as-code — see ../keycloak/realm-mersal.json (mersal realm, hbmp-api + hbmp-web).
      - ../keycloak/realm-mersal.json:/opt/keycloak/data/import/realm-mersal.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [hbmp]

  # ---------------------------------------------------------------- Kong API gateway (DB-less)
  kong:
    image: kong:3.7
    <<: *restart
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_LOG_LEVEL: notice
    ports:
      - "8000:8000"          # public API proxy
      - "127.0.0.1:8001:8001" # admin — localhost only
    volumes:
      - ./config/kong.yml:/etc/kong/kong.yml:ro
    networks: [hbmp]

  # ---------------------------------------------------------------- MinIO (S3 object storage + WORM)
  minio:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [hbmp]

  # ---------------------------------------------------------------- RabbitMQ (command queues)
  rabbitmq:
    image: rabbitmq:3.13-management
    <<: *restart
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [hbmp]

  # ---------------------------------------------------------------- NATS JetStream (event stream)
  nats:
    image: nats:2.10
    <<: *restart
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"  # client
      - "8222:8222"  # monitoring
    networks: [hbmp]

  # ---------------------------------------------------------------- Valkey (cache)
  valkey:
    image: valkey/valkey:8
    <<: *restart
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--save", "60", "1"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [hbmp]

  # ---------------------------------------------------------------- OpenSearch (search)
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    <<: *restart
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      # STARTER ONLY: disable the security plugin for first boot. TURN THIS OFF (=false) before real data.
      DISABLE_SECURITY_PLUGIN: "${OPENSEARCH_DISABLE_SECURITY:-true}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    networks: [hbmp]

  # ---------------------------------------------------------------- OpenBao (secrets / KMS)
  # STARTER: dev mode (in-memory, root token). Replace with a real server + unseal for production.
  openbao:
    image: openbao/openbao:latest
    <<: *restart
    cap_add: ["IPC_LOCK"]
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
    volumes:
      - baodata:/openbao/file
    networks: [hbmp]

  # ---------------------------------------------------------------- ClamAV (upload malware scan)
  clamav:
    image: clamav/clamav:latest
    <<: *restart
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    networks: [hbmp]

  # ---------------------------------------------------------------- Observability: Prometheus / Grafana / Loki / Tempo
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    networks: [hbmp]

  alertmanager:
    image: prom/alertmanager:latest
    <<: *restart
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["9093:9093"]
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [hbmp]

  loki:
    image: grafana/loki:3.1.0
    <<: *restart
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - lokidata:/loki
    networks: [hbmp]

  tempo:
    image: grafana/tempo:latest
    <<: *restart
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # tempo query
      - "4317:4317"   # OTLP gRPC (services send traces here)
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks: [hbmp]

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    networks: [hbmp]

  # ================================================================ APPLICATION SERVICES
  # Built from source for Tier 1 (context = repo root). In Tier 2/3 these become Harbor images
  # deployed by Helm. Add each service here as it is built (patient/policy/emr/... to come).

  # --- audit-service (0.3): the audit spine. Internal only (no public Kong route). ---
  audit-service:
    build:
      context: ../..
      dockerfile: services/audit/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Audit: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Messaging__Uri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      Messaging__Queue: "audit.events"
      Worm__Endpoint: "http://minio:9000"
      Worm__AccessKey: "${MINIO_ROOT_USER}"
      Worm__SecretKey: "${MINIO_ROOT_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [hbmp]

  # --- hello-service (0.5): the vertical-slice proof (auth+authz+audit+events+OTel). ---
  hello-service:
    build:
      context: ../..
      dockerfile: services/hello/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8090:8080"]   # also reachable via Kong at :8000/api/v1/hello
    depends_on:
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    networks: [hbmp]

  # --- masterdata-service (0b): reference data (ICD/CPT/ATC/drugs) + validation APIs. ---
  masterdata-service:
    build:
      context: ../..
      dockerfile: services/masterdata/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MasterData: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8091:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [hbmp]

  # --- patient-service (1.1): beneficiary registration, identifiers, dedup. ---
  patient-service:
    build:
      context: ../..
      dockerfile: services/patient/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Patient: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8092:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [hbmp]

  # --- policy-service (1.2): policy/coverage/limits + reset job. ---
  policy-service:
    build: { context: ../.., dockerfile: services/policy/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Policy: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8093:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [hbmp]

  # --- document-service (1.3): validated + malware-scanned uploads. ---
  document-service:
    build: { context: ../.., dockerfile: services/document/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Document: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      ClamAV__Host: "clamav"
      Blob__Endpoint: "http://minio:9000"
      Blob__AccessKey: "${MINIO_ROOT_USER}"
      Blob__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8094:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      clamav: { condition: service_started }
    networks: [hbmp]

  # --- eligibility-service (2.1): decision engine + cache + event-driven invalidation. ---
  eligibility-service:
    build: { context: ../.., dockerfile: services/eligibility/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Eligibility: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Cache__Valkey: "valkey:6379,password=${VALKEY_PASSWORD}"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8095:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
      valkey: { condition: service_healthy }
    networks: [hbmp]

  # --- emr-service (2.3): status-driven visit gating + encounter/queue stub. ---
  emr-service:
    build: { context: ../.., dockerfile: services/emr/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Emr: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Eligibility__BaseUrl: "http://eligibility-service:8080"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8096:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      eligibility-service: { condition: service_started }
    networks: [hbmp]

  # --- provider-service (2b): provider network, contracts, onboarding + provider isolation. ---
  provider-service:
    build: { context: ../.., dockerfile: services/provider/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Provider: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Masterdata__BaseUrl: "http://masterdata-service:8080"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8097:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
    networks: [hbmp]

  # --- orders-service (4.2/5): investigation orders + CPT/LOINC + lab/imaging fulfillment. ---
  orders-service:
    build: { context: ../.., dockerfile: services/orders/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Orders: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8098:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
    networks: [hbmp]

  # --- pharmacy-service (4.3/6): e-prescriptions + dispensing (batch/expiry/substitution). ---
  pharmacy-service:
    build: { context: ../.., dockerfile: services/pharmacy/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Pharmacy: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8099:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
    networks: [hbmp]

  # --- approvals-service (7): authorization worklist, decisions, break-glass, SLA/TAT. ---
  approvals-service:
    build: { context: ../.., dockerfile: services/approvals/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Approvals: "Host=postgres;Database=hbmp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Authority: "http://keycloak:8080/realms/mersal"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ValidIssuers__0: "http://localhost:8080/realms/mersal"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["8100:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
    networks: [hbmp]

  # --- notification-service (8.1): event-driven bilingual fan-out (in-app + email live). ---
  notification-service:
    build: { context: ../.., dockerfile: services/notification/Dockerfile }
    <<: *restart
