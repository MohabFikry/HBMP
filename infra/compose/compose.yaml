# Mersal HBMP — Tier 1 (single-server) Docker Compose starter
# Open-source, on-prem-first, cloud-ready stack (see ../../0C-OPEN-SOURCE-STACK.md).
# This stands up the INFRASTRUCTURE the platform runs on. Application services
# (identity/patient/policy/... + web) are added as they are built — a template is at the bottom.
#
# ⚠️ STARTER, NOT PRODUCTION-HARDENED. Before real data:
#   - move every secret out of .env into OpenBao; enable TLS at the edge (Traefik + Let's Encrypt + ModSecurity/OWASP CRS)
#   - turn OpenSearch security ON; run identity-service in production mode; run OpenBao as a real server (not -dev)
#   - enable LUKS full-disk encryption on the host; wire pgBackRest + restic offsite backups
# See README.md and phase-11-hardening-and-nfr.md.

name: mersal-hbmp

x-restart: &restart
  restart: unless-stopped

networks:
  hbmp:
    driver: bridge

volumes:
  identitykeys:   # data-protection key ring (anti-forgery); see identity-service
  pgdata:
  miniodata:
  rabbitmqdata:
  opensearchdata:
  grafanadata:
  prometheusdata:
  lokidata:
  baodata:

services:
  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]  # 55432 on host (local PG16 owns 5432); services use hostname "postgres"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hbmp]

  # ---------------------------------------------------------------- identity-service (in-app OIDC issuer)
  # Phase 17 (ADR-0015): replaced Keycloak. ASP.NET Identity + OpenIddict — the platform's own OAuth2/OIDC
  # authorization server. Browser reaches it at localhost:8090; services validate via http://identity-service:8080
  # (split-horizon dev: token iss=localhost:8090 is accepted through each service's Auth__ValidIssuers__0).
  identity-service:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Tier-1 dev only: the seeded demo users have no enrolled TOTP, and identity's admin surfaces
      # require a step-up — with the gate on, every access-model screen answers 401. Defaults to true in
      # code; never carry this into a Helm values file (see docs/adr/0015 + the .env warning).
      Auth__ProtectedScopeRequiresMfa: "false"
      ConnectionStrings__Identity: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      # The issuer identifier this service publishes AND validates against — must match the URL the browser
      # uses, and must NOT be derived from the request (Kong's Host is localhost:8000). Trailing slash is
      # significant: it is compared as a string.
      Issuer__PublicUrl: "http://localhost:8090/"
      Issuer__WebRedirectUri: "http://localhost:5173/"
      Issuer__WebPostLogoutUri: "http://localhost:5173/"
      # 28.11 — how long a SPENT OAuth token's row is kept before TokenPruner deletes it.
      #
      # Stated here rather than left to the code default so the number is visible to whoever is asked what
      # the retention actually is. 30 days is the conservative end of the 30–90 day "transient" class in
      # 20-compliance-checklist §6; the DPO can move it without a rebuild.
      #
      # It cannot sign anybody out at any value: OpenIddict prunes only what is already expired or spent, so
      # this governs how far back the token table can answer a forensic question — and `identity.login_attempt`
      # plus the hash-chained audit store answer that better, for 6–7 years.
      Issuer__TokenRetentionDays: "30"
      # 28.1 — how many proxies sit between the browser and this service. Kong alone today, so 1.
      #
      # Stated rather than defaulted, because it is the number the credential rate limiter counts back through
      # to find the CLIENT, and both ways of getting it wrong are invisible at runtime: one too few and every
      # caller collapses onto the gateway's address again (ten sign-in attempts a minute for the whole
      # platform, exhaustible by anyone), one too many and a caller picks their own bucket by writing a header.
      # It becomes 2 when the SPA's own nginx fronts the gateway so the browser sees one origin (ADR-0036 §4).
      # 28.2 raised this from 1 to 2: the SPA's own nginx now fronts the gateway, so browser → nginx → Kong →
      # here is two proxies. Left at 1 the chain's last entry is NGINX's address, and every browser client
      # collapses onto it — the platform-wide sign-in outage of 28.1, restored by a change that never
      # mentioned rate limiting.
      Forwarding__TrustedHops: "2"
      # 28.5 — SMTP for the password-reset link. Tier 1 points at the local Mailpit sink; a deployed tier
      # points these at the real relay and nothing in the code changes. Security__None is spelled out here
      # BECAUSE it is wrong everywhere else — the default is StartTls, and plain SMTP has to be asked for.
      Email__Host: "mailpit"
      Email__Port: "1025"
      Email__Security: "None"
      Email__FromAddress: "no-reply@mersal.local"
      Email__FromName: "Mersal HBMP"
      Issuer__ServiceClientSecret: "${IDENTITY_SERVICE_SECRET}"
      Issuer__DemoPassword: "${IDENTITY_DEMO_PASSWORD}"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      # 21.4 follow-up — PERSISTENT issuer keys, mounted read-only from ./secrets (gitignored, generated by
      # up.sh). Ephemeral keys made every restart sign everyone out: the encryption key wraps refresh tokens as
      # JWE, so outstanding refresh tokens became undecryptable, silent renew answered invalid_grant, and the
      # session died at the 5-minute access-token expiry — indistinguishable, from the user's side, from "the
      # session timeout is far too short". The signing key's rotating `kid` also invalidated Kong's pinned public
      # key on every restart. OpenBao's transit engine remains the production home (Phase 12); this is the
      # Tier 1 arrangement, on the same LUKS-encrypted disk as the database.
      Issuer__SigningKeyPemPath: "/run/secrets/issuer-signing.pem"
      Issuer__EncryptionKeyPemPath: "/run/secrets/issuer-encryption.pem"
    # The data-protection key ring, on a named volume so it OUTLIVES the container. Without this the ring was
    # ephemeral: recreating identity-service invalidated every anti-forgery token in flight, so anyone sitting on
    # the login page got HTTP 500 on submit ("the key {…} was not found in the key ring"). It also made more than
    # one replica impossible — each would hold its own ring and reject forms served by the others.
    volumes:
      - identitykeys:/var/lib/hbmp/dpkeys
      - ./secrets:/run/secrets:ro
    ports: ["127.0.0.1:8090:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [hbmp]

  # ---------------------------------------------------------------- Kong API gateway (DB-less)
  kong:
    image: kong:3.7
    <<: *restart
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # 18.B3 (S8) — edge JWT validation. Must match the issuer exactly: `iss` is the lookup key for the
      # registered signing key, so a trailing slash here rejects every token at the gateway.
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-http://localhost:8090/}
      IDENTITY_JWKS_PUBLIC_KEY: ${IDENTITY_JWKS_PUBLIC_KEY}
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_LOG_LEVEL: notice
    ports:
      - "8000:8000"          # public API proxy
      - "127.0.0.1:8001:8001" # admin — localhost only
    volumes:
      - ./config/kong.yml:/etc/kong/kong.template.yml:ro
    # Render the two injected values into the declarative config before Kong reads it. Kong's own
    # `{vault://env/…}` references cannot do this: only fields a plugin schema marks `referenceable` are
    # resolved, and `jwt_secrets.rsa_public_key` is not one — Kong kept the literal reference and refused to
    # boot. The PEM's newlines are re-encoded as \n so they survive the single-line substitution; the YAML
    # double-quoted scalar in the template turns them back into a real PEM.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # Four backslashes, not two: awk emits a literal \\n, which sed then unescapes to the \n that the YAML
        # scalar wants. With only two, sed's own replacement handling turns \n into a REAL newline and splits
        # the quoted scalar across lines — which is the same "invalid key" failure, one layer further in.
        pem=$$(printf '%s' "$$IDENTITY_JWKS_PUBLIC_KEY" | awk '{printf "%s\\\\n", $$0}')
        sed -e "s|__IDENTITY_ISSUER__|$$IDENTITY_ISSUER|" \
            -e "s|__IDENTITY_JWKS_PUBLIC_KEY__|$$pem|" \
            /etc/kong/kong.template.yml > /tmp/kong.yml
        exec /docker-entrypoint.sh kong docker-start
    networks: [hbmp]

  # ---------------------------------------------------------------- MinIO (S3 object storage + WORM)
  minio:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [hbmp]

  # ---------------------------------------------------------------- RabbitMQ (command queues)
  rabbitmq:
    image: rabbitmq:3.13-management
    <<: *restart
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [hbmp]

  # ------------------------------------------------------- RabbitMQ dead-letter topology (one-shot)
  # Every consumer on this platform rejects a failed message with requeue:false and its comments call
  # that "dead-lettering". It was not: no queue declared x-dead-letter-exchange and no dead-letter
  # exchange existed, so the broker did the only other thing it can with a rejected, non-requeued
  # message — dropped it. A transient database blip while applying OrderLinesConsumed destroyed a
  # benefit-accumulator movement; a dropped BeneficiaryRegistered left a person unknown at every desk.
  # Nothing alarmed, because from the broker's point of view nothing had gone wrong.
  #
  # A POLICY, not queue arguments: arguments are immutable after declaration, so adding
  # x-dead-letter-exchange to the twelve QueueDeclare call sites would fail every service with
  # PRECONDITION_FAILED against the queues already on the broker. A policy attaches to queues that
  # already exist and to any queue a later service adds without it having to remember this rule.
  #
  # A one-shot container, not load_definitions: RabbitMQ skips RABBITMQ_DEFAULT_USER creation when a
  # definitions file is loaded, so that route silently leaves the broker with no users at all — and
  # putting the credentials in the definitions file to compensate would commit them to the repo.
  # This reads them from the environment like every other service.
  rabbitmq-init:
    image: rabbitmq:3.13-management
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        A="rabbitmqadmin -H rabbitmq -u $$RABBITMQ_USER -p $$RABBITMQ_PASSWORD"
        $$A declare exchange name=hbmp.dlx type=fanout durable=true
        $$A declare queue name=hbmp.dead-letter durable=true
        $$A declare binding source=hbmp.dlx destination=hbmp.dead-letter destination_type=queue
        # The DLQ is excluded from its own policy: a queue that dead-letters to the exchange feeding it
        # would loop a poison message forever instead of parking it.
        $$A declare policy name=hbmp-dead-letter pattern='^(?!hbmp\.dead-letter$$).*' \
          apply-to=queues priority=0 definition='{"dead-letter-exchange":"hbmp.dlx"}'
        echo "dead-letter topology applied"
    restart: "no"
    networks: [hbmp]

  # ---------------------------------------------------------------- NATS JetStream (event stream)
  nats:
    image: nats:2.10
    <<: *restart
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"  # client
      - "8222:8222"  # monitoring
    networks: [hbmp]

  # ---------------------------------------------------------------- Valkey (cache)
  valkey:
    image: valkey/valkey:8
    <<: *restart
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--save", "60", "1"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [hbmp]

  # ---------------------------------------------------------------- OpenSearch (search)
  # --- mailpit: a Tier-1 SMTP sink, so the password-reset link is actually deliverable (28.5) ---
  #
  # Not a nicety. Before this, the platform's only email provider wrote a LOG LINE and returned success, so a
  # reset screen would have said "we have sent you a link" while nothing was sent — a failed operation
  # rendered as a clean result, on the one screen a locked-out person reaches when nothing else works.
  # Mailpit accepts SMTP and shows what arrived at :8025; a real relay replaces it in the deployed tiers via
  # the same Email__* settings, and NOTHING in the code changes when it does.
  #
  # It stores mail in memory and is bound to localhost. No credential in a reset link ever leaves this host.
  mailpit:
    image: axllent/mailpit:v1.20
    <<: *restart
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports: ["127.0.0.1:8025:8025"]
    networks: [hbmp]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    <<: *restart
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      # Secure by default: the security plugin stays ON unless a dev explicitly opts out via
      # OPENSEARCH_DISABLE_SECURITY=true in their (gitignored) .env. Never disable with real data.
      DISABLE_SECURITY_PLUGIN: "${OPENSEARCH_DISABLE_SECURITY:-false}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["127.0.0.1:9200:9200"]
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    networks: [hbmp]

  # ---------------------------------------------------------------- OpenBao (secrets / KMS)
  # STARTER: dev mode (in-memory, root token). Replace with a real server + unseal for production.
  openbao:
    image: openbao/openbao:latest
    <<: *restart
    cap_add: ["IPC_LOCK"]
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["127.0.0.1:8200:8200"]
    volumes:
      - baodata:/openbao/file
    networks: [hbmp]

  # ---------------------------------------------------------------- ClamAV (upload malware scan)
  clamav:
    image: clamav/clamav:latest
    <<: *restart
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    networks: [hbmp]

  # ---------------------------------------------------------------- Observability: Prometheus / Grafana / Loki / Tempo
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    networks: [hbmp]

  alertmanager:
    image: prom/alertmanager:latest
    <<: *restart
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [hbmp]

  loki:
    image: grafana/loki:3.1.0
    <<: *restart
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - lokidata:/loki
    networks: [hbmp]

  tempo:
    image: grafana/tempo:latest
    <<: *restart
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # tempo query
      - "4317:4317"   # OTLP gRPC (services send traces here)
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks: [hbmp]

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    networks: [hbmp]

  # ================================================================ APPLICATION SERVICES
  # Built from source for Tier 1 (context = repo root). In Tier 2/3 these become Harbor images
  # deployed by Helm. Add each service here as it is built (patient/policy/emr/... to come).

  # --- audit-service (0.3): the audit spine. Internal only (no public Kong route). ---
  audit-service:
    build:
      context: ../..
      dockerfile: services/audit/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Audit: "Host=postgres;Database=hbmp;Username=hbmp_audit;Password=${HBMP_AUDIT_PASSWORD}"
      Auth__Authority: "http://identity-service:8080"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ProtectedScopeRequiresMfa: "false"
      Auth__ValidIssuers__0: "http://localhost:8090/"
      Messaging__Uri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      Messaging__Queue: "audit.events"
      # Messaging__* is the ingest consumer; Events__RabbitUri is the publisher this service now uses to
      # emit its OWN audit.read events onto the same queue. Both point at the same broker; without this
      # the publisher would fall back to the guest:guest default and fail to connect.
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      Worm__Endpoint: "http://minio:9000"
      Worm__AccessKey: "${MINIO_ROOT_USER}"
      Worm__SecretKey: "${MINIO_ROOT_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      identity-service: { condition: service_started }
    networks: [hbmp]

  # hello-service (phase-0.5 vertical-slice proof) removed from the prod topology in 16.5 — no demo
  # endpoint in a deployable stack. Source retained under services/hello for reference/tests only.

  # --- masterdata-service (0b): reference data (ICD/CPT/ATC/drugs) + validation APIs. ---
  masterdata-service:
    build:
      context: ../..
      dockerfile: services/masterdata/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MasterData: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://identity-service:8080"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ProtectedScopeRequiresMfa: "false"
      Auth__ValidIssuers__0: "http://localhost:8090/"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["127.0.0.1:8091:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      identity-service: { condition: service_started }
    networks: [hbmp]

  # --- patient-service (1.1): beneficiary registration, identifiers, dedup. ---
  patient-service:
    build:
      context: ../..
      dockerfile: services/patient/Dockerfile
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Patient: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://identity-service:8080"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ProtectedScopeRequiresMfa: "false"
      Auth__ValidIssuers__0: "http://localhost:8090/"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["127.0.0.1:8092:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      identity-service: { condition: service_started }
    networks: [hbmp]

  # --- policy-service (1.2): policy/coverage/limits + reset job. ---
  policy-service:
    build: { context: ../.., dockerfile: services/policy/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Policy: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://identity-service:8080"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ProtectedScopeRequiresMfa: "false"
      Auth__ValidIssuers__0: "http://localhost:8090/"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["127.0.0.1:8093:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      identity-service: { condition: service_started }
    networks: [hbmp]

  # --- document-service (1.3): validated + malware-scanned uploads. ---
  document-service:
    build: { context: ../.., dockerfile: services/document/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Document: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://identity-service:8080"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ProtectedScopeRequiresMfa: "false"
      Auth__ValidIssuers__0: "http://localhost:8090/"
      ClamAV__Host: "clamav"
      Blob__Endpoint: "http://minio:9000"
      Blob__AccessKey: "${MINIO_ROOT_USER}"
      Blob__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Events__RabbitUri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports: ["127.0.0.1:8094:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      identity-service: { condition: service_started }
      clamav: { condition: service_started }
    networks: [hbmp]

  # --- eligibility-service (2.1): decision engine + cache + event-driven invalidation. ---
  eligibility-service:
    build: { context: ../.., dockerfile: services/eligibility/Dockerfile }
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Eligibility: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://identity-service:8080"
      Auth__Audience: "hbmp-api"
      Auth__RequireHttpsMetadata: "false"
      Auth__ProtectedScopeRequiresMfa: "false"
      Auth__ValidIssuers__0: "http://localhost:8090/"
