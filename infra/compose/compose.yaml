  # --- web: the React role portals (phase 9), served behind Kong. ---
  # 18.C2 (audit R2 W6): commented out since phase 9. `docker compose up` brought up twenty services and no
  # user interface, so every "is the platform running?" check had to be a curl against a JSON endpoint.
  web:
    # BUILD args, not `environment:`. Vite inlines VITE_* when the bundle is compiled; the same names under
    # `environment:` go to the nginx container at runtime, which ignores them — so the image kept the
    # Dockerfile's blank ARG defaults and shipped an EMPTY OIDC authority and client id. Sign-in could not
    # start, and the misconfiguration was invisible from both the build log and the running container.
    #
    # 28.2 — ONE ORIGIN. These are all RELATIVE now, so the browser resolves them against http://localhost:5173
    # and this container's nginx proxies /api, /connect, /.well-known and /identity to Kong (ADR-0036 §4).
    #
    # What this replaced: VITE_API_BASE at :8000 and VITE_OIDC_AUTHORITY at :8090 — three origins for one
    # application, so signing in navigated the browser to a visibly different host. The old comment here said
    # the issuer had to be reached directly "because the token's `iss` must be the issuer as the browser sees
    # it". That stopped being true when OpenIddict's issuer was pinned via Issuer__PublicUrl (the ID2088 fix,
    # a few lines up in this same file): `iss` is now a constant the server states, so it is unaffected by
    # which host the request arrived on, and nothing that validates it needs to change.
    #
    # VITE_OIDC_REDIRECT stays ABSOLUTE: it is sent to the issuer as `redirect_uri` and compared byte-for-byte
    # against the registered client, so it must be the URL the browser will actually land on.
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: "/api/v1"
        VITE_OIDC_AUTHORITY: ""
        VITE_OIDC_CLIENT_ID: "hbmp-web"
        VITE_OIDC_REDIRECT: "http://localhost:5173/"
        # "1", not "true" — config.ts now accepts either, but this is the spelling the Dockerfile documents.
        VITE_LIVE: "1"
    environment:
      # RUNTIME env, correctly — these are nginx's, not Vite's. The distinction cost a whole debugging session
      # once already (see the build-args note above): VITE_* under `environment:` reaches nginx, which ignores
      # them, and the bundle keeps whatever was baked at build time.
      KONG_UPSTREAM: "http://kong:8000"
    <<: *restart
    # The image's nginx listens on 8080 (apps/web/nginx.conf + Dockerfile EXPOSE), not 80 — mapping to :80
    # published a port nothing was bound to, so :5173 reset the connection with the container "Up".
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      kong: { condition: service_started }
      identity-service: { condition: service_started }
    networks: [hbmp]
