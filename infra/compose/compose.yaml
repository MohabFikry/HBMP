    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Interop: "Host=postgres;Database=hbmp;Username=hbmp_app;Password=${HBMP_APP_PASSWORD}"
      Auth__Authority: "http://identity-service:8080"
